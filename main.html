<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
	<div class="container mt-5">
		<h3 class="text-centre mb-4">Internship Form</h3>
	
	<form>
		<div class="row">
			<div class="col-md-4 mb-3">
				<label class="first-name-input" class="form-label">
					First Name</label>
				<input type="text"
                           class="form-control"
                           id="first-name-input"
                           placeholder="Enter your first name">
				<div class="form-text">
					Please enter your first name.
				</div>
			</div>
			<div class="col-md-4 mb-3">
				<label for="last-name-input" class="form-label">
					Last Name</label>
				<input type="text"
					    class="form-control"
					    id="last-name-input"
					    placeholder="Enter your last name">
				<div class="form-text">
					Please enter your last name
				</div>
			</div>
			<div class="col-md-4 mb-3">
				<label for="email-input" class="form-label">
					Email Address
				</label>
				<input type="email"
                           class="form-control"
                           id="email-input"
                           placeholder="Enter your email">

                    <div class="form-text">
                        Please enter a valid email address.
                    </div>
                </div>
			<div class="col-md-4 mb-3">
				<label for="college-input" class="form-label">
					College</label>
				<input type="text"
					    id="college-input"
					    class="form-control"
					    placeholder="Enter your college name">
				<div class="form-text">
					Please enter your college name.
			</div> 
			</div>
			<div class="col-md-4 mb-3">
				<label for="graduation-year-input" class="form-label">
					Graduation Year</label>
				<select class="form-select" id="graduation-year-input">
					<option selected disabled>Choose...</option>
					<option value=2020>2020</option>
					<option value=2021>2021</option>
					<option value=2022>2022</option>
					<option value=2023>2023</option>
				</select>
				<div class="form-text">
					Please select your graduation year.
			</div> 
			</div>
			<div class="col-md-4 mb-3">
				<label for="roll-no-input" class="form-label">
					Roll No.</label>
				<input type="text"
					    id="roll-no-input"
					    class="form-control"
					    placeholder="Enter your Roll no.">
				<div class="form-text">
					Please provide a valid Roll no.
			</div> 
			</div>
		</div>

		 <div class="form-check mb-3">
			 <input type="checkbox"
                       class="form-check-input"
                       id="conditions-checkbox">

                <label class="form-check-label"
                       for="conditions-checkbox">

                    I agree to the terms and conditions.

                </label>
			 <div class="form-text">
                    Please accept the terms and conditions.

                </div>
			 </div>
			 <button type="submit"
                    class="btn btn-primary">
                Submit
            </button>

        </form>

		 </div>
		
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
